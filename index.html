<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Insight - ข้อคิดและสติเตือนใจหลากหลายมุมมอง</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kanit', sans-serif;
        }

        body {
            /* พื้นหลังสีฟ้านุ่มๆ นิ่งๆ สบายตา ผ่อนคลาย */
            background-color: #E3EEF7;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* การ์ดแก้วสีขาวสะอาด สบายตา */
        .card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 45px 35px;
            max-width: 520px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(50, 90, 130, 0.08);
            border: 1px solid rgba(255, 255, 255, 1);
            position: relative;
            z-index: 10;
        }

        /* ไอคอนหัวข้อ */
        .icon {
            font-size: 55px;
            margin-bottom: 8px;
            display: inline-block;
        }

        h1 {
            color: #2B547E;
            font-size: 1.7rem;
            font-weight: 600;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
        }

        /* กล่องแสดงประโยคฮีลใจ */
        .quote-box {
            min-height: 130px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #F0F6FC;
            border-radius: 24px;
            padding: 25px;
            margin-bottom: 30px;
            border: 1.5px dashed #B0D0E8;
            position: relative;
        }

        .quote-text {
            color: #2C4356;
            font-size: 1.25rem;
            font-weight: 400;
            line-height: 1.7;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        /* ปุ่มกดโทนฟ้าละมุน */
        button {
            background-color: #3B7A9E;
            color: white;
            border: none;
            padding: 16px 36px;
            font-size: 1.05rem;
            font-weight: 500;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(59, 122, 158, 0.25);
            transition: all 0.2s ease;
            outline: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        button:hover {
            background-color: #2E6280;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(59, 122, 158, 0.35);
        }

        button:active {
            transform: translateY(0);
        }

        /* เอฟเฟกต์ประกาย/ไอคอนลอยเบาๆ เวลาคลิก */
        .floating-heart {
            position: absolute;
            pointer-events: none;
            animation: floatUp 1.2s ease-out forwards;
            font-size: 22px;
            z-index: 100;
        }

        @keyframes floatUp {
            0% {
                opacity: 0.9;
                transform: translateY(0) scale(0.8);
            }
            100% {
                opacity: 0;
                transform: translateY(-60px) scale(1.2);
            }
        }
    </style>
</head>
<body>

    <div class="card" id="card">
        <div class="icon">💡✨</div>
        <h1>ข้อคิดและมุมมองชีวิต</h1>
        
        <div class="quote-box">
            <p class="quote-text" id="quote">สุ่มรับข้อคิดหลากหลายมุมมองเพื่อเติมพลังปัญญา 🧠</p>
        </div>

        <button onclick="getRandomQuote(event)">
            <span>สุ่มข้อคิดชีวิต</span> 🕊️
        </button>
    </div>

    <script>
        const quotes = [
            "เวลาที่เราสูญเสียไปกับการโกรธใครสักคน คือเวลาที่เราขโมยความสุขจากตัวเองไป",
            "การไม่ตอบโต้คน Toxic บางครั้งไม่ใช่เพราะเราแพ้ แต่เพราะเราฉลาดพอที่จะไม่เอาพิมเสนไปแลกกับเกลือ",
            "ชีวิตไม่ได้เรียบง่ายตลอดเวลา แต่ความสามารถในการยืดหยุ่นต่างหากที่จะพาเราผ่านไปได้",
            "การที่เราเป็นคนดี ไม่ได้แปลว่าคนอื่นจะต้องดีตอบ จงทำดีเพื่อรักษามาตรฐานของเรา ไม่ใช่เพื่อหวังผล",
            "บางครั้งการยอมรับว่า 'เราไม่รู้' คือจุดเริ่มต้นที่ทรงพลังที่สุดของการเรียนรู้สิ่งใหม่",
            "ความสุขที่แท้จริง มักซ่อนอยู่ในการทำเรื่องธรรมดาให้มีความหมาย",
            "การปล่อยวางคนที่ไม่เห็นคุณค่าในตัวเรา คือการเปิดพื้นที่ให้คนที่ใช่เข้ามาในชีวิต",
            "อย่าให้ความกลัวที่จะทำผิดพลาด มาขัดขวางโอกาสที่เราจะได้เรียนรู้และเติบโต",
            "การมีเป้าหมายในชีวิตชัดเจน ช่วยให้เรามองข้ามเสียงรบกวนรอบข้างไปได้ครึ่งหนึ่ง",
            "จงดูแลใจตัวเองให้ดี เพราะไม่มีใครแบกรับความรู้สึกของเราได้ตลอด 24 ชั่วโมง",
            "ความพยายามที่ไม่มีทิศทาง ก็เหมือนเรือที่ไร้หางเสือ เหนื่อยเท่าไหร่ก็วนอยู่ที่เดิม",
            "ความเงียบเป็นคำตอบที่ทรงพลังที่สุด ในยามที่เราไม่อยากต่อความยาวสาวความยืด",
            "คำพูดที่ออกจากปากเราไปแล้ว เปรียบเสมือนลูกศรที่ปล่อยออกจากคันธนู ไม่มีวันเรียกคืนได้",
            "การลงทุนที่ให้ผลตอบแทนยั่งยืนที่สุด คือการลงทุนพัฒนาความรู้และสุขภาพของตัวเราเอง",
            "อย่าเอาความสุขทั้งชีวิตไปแขวนไว้กับความสำเร็จชั่วคราวเพียงอย่างเดียว",
            "ความซื่อสัตย์ต่อตัวเอง คือเกราะป้องกันที่ดีที่สุดจากคำคร่ำครวญของผู้อื่น",
            "ปัญหาทุกข้อมีวันหมดอายุของมัน เช่นเดียวกับความทุกข์ที่ผ่านเข้ามาแล้วก็ผ่านไป",
            "การที่เราเลือกที่จะนิ่ง ไม่ได้หมายความว่าเราโง่ แต่เราเลือกที่จะสงบสติอารมณ์",
            "จงยินดีกับก้าวเล็กๆ ของตัวเอง เพราะทุกความสำเร็จใหญ่ ล้วนประกอบขึ้นจากก้าวเล็กๆ เหล่านี้",
            "การคาดหวังให้คนอื่นปฏิบัติกับเราเหมือนที่เราปฏิบัติกับเขา มักนำมา 90% ของความผิดหวัง",
            "จงใช้ชีวิตให้เหมือนนักเรียนรู้ ไม่ใช่ผู้รู้ เพราะโลกใบนี้มีอะไรให้เราเรียนรู้อีกเยอะ",
            "ในวันที่ฝนตกหนัก ท้องฟ้าเบื้องหลังเมฆดำยังคงสดใสเสมอ เช่นเดียวกับอนาคตของเรา",
            "การจัดลำดับความสำคัญของชีวิต ช่วยให้เราไม่ต้องเหนื่อยล้าไปกับเรื่องที่ไม่สำคัญ",
            "ความมั่นใจในตัวเองสร้างได้จากการทำตามสัญญาที่เราให้ไว้กับตัวเอง",
            "อย่าปล่อยให้คำพูดของคนเพียงคนเดียว มาทำลายความพยายามตลอดปีของเรา",
            "การเลือกคบเพื่อนหรือคนรอบข้างที่ดี มีผลต่อทิศทางชีวิตมากกว่าที่คิด",
            "จงเรียนรู้ที่จะมีความสุขในความเงียบ และความสงบในพื้นที่ส่วนตัว",
            "ความล้มเหลวเป็นเพียงหลักฐานว่าเราได้ลงมือทำอะไรบางอย่าง ดีกว่าคนที่ไม่เคยลองทำอะไรเลย",
            "การให้เกียรติผู้อื่น สะท้อนถึงวุฒิภาวะและความงดงามภายในจิตใจของเราเอง",
            "ทุกการตัดสินใจในวันนี้ คือการสร้างตัวตนของเราในวันพรุ่งนี้",
            "อย่ากลัวการเริ่มต้นใหม่ เพราะมันคือโอกาสที่เราจะได้ทำทุกอย่างให้ดีกว่าเดิม",
            "ความทุกข์ส่วนใหญ่ไม่ได้มาจากเหตุการณ์ตรงหน้า แต่มาจากความคิดที่เราตีความมันต่างหาก",
            "การรู้จักปฏิเสธในสิ่งที่บั่นทอนจิตใจ คือศิลปะของการรักตัวเองอย่างแท้จริง",
            "จงมีความสุขกับปัจจุบัน เพราะอดีตผ่านไปแล้ว และอนาคตก็ยังมาไม่ถึง",
            "ความเพียรพยายามที่ไม่เคยย่อท้อ สามารถเอาชนะอุปสรรคที่ยากเย็นที่สุดได้",
            "การมองโลกตามความเป็นจริง ช่วยให้เราตั้งรับกับความเปลี่ยนแปลงได้ดีขึ้น",
            "จงเชื่อมั่นในจังหวะชีวิตของตัวเอง ไม่ต้องรีบเร่งแข่งกับใครบนโลกนี้",
            "การที่เราให้อภัย ไม่ได้แปลว่าเราโง่ แต่เราเลือกที่จะตัดวงจรความแค้นเพื่อตัวเราเอง",
            "ความสุขที่ยั่งยืน เกิดจากการที่เราพึ่งพาความสุขทางใจจากตัวเองได้",
            "การมีสติอยู่กับปัจจุบัน คือเวทมนตร์ที่ช่วยลดความกังวลใจลงไปได้ครึ่งหนึ่ง",
            "อย่าเสียเวลาพิสูจน์ตัวเองให้คนอคติฟัง เพราะไม่ว่าเราจะทำดีแค่ไหนเขาก็ไม่ชอบเราอยู่ดี",
            "ทุกบทเรียนราคาแพงที่ผ่านมา ล้วนสร้างภูมิคุ้มกันที่แข็งแกร่งให้เราในวันนี้",
            "การรับฟังความคิดเห็นที่แตกต่าง เปิดโลกทัศน์ของเราให้กว้างขึ้นกว่าเดิม",
            "จงจำไว้ว่าไม่มีใครสมบูรณ์แบบ การยอมรับข้อผิดพลาดคือความงดงามของความเป็นมนุษย์",
            "การสร้างนิสัยที่ดีวันละนิด มีพลังมากกว่าการตั้งเป้าหมายใหญ่แต่ไม่เคยทำ",
            "จงใจดีกับตัวเองให้มากๆ ในวันที่โลกใบนี้ดูเหมือนจะไม่เป็นใจ",
            "ความพึงพอใจในสิ่งที่ตนมี คือความมั่งคั่งที่แท้จริงที่ไม่มีใครแย่งไปได้",
            "การตั้งขอบเขต (Boundaries) ในความสัมพันธ์ ช่วยปกป้องหัวใจของเราไม่ให้เจ็บซ้ำซาก",
            "ความสำเร็จไม่ได้วัดกันที่ทรัพย์สินเงินทอง แต่วัดกันที่ความสุขสงบในจิตใจ",
            "จงใช้ชีวิตในแบบที่เราภาคภูมิใจ ไม่ใช่ในแบบที่คนอื่นอยากให้เป็น",
            "การที่เราล้มลง ไม่ได้แปลว่าเราต้องนอนอยู่ที่เดิม ลุกขึ้นมาแล้วปัดฝุ่นเดินต่อ",
            "ความตั้งใจจริง มักจะหาหนทางเจอเสมอ ในขณะที่คนไม่อยากทำมักจะหาข้อแก้ตัว",
            "การรักษาคำพูดและตรงต่อเวลา คือเครื่องหมายของคนที่มีเกียรติและน่าเชื่อถือ",
            "อย่าปล่อยให้อดีตที่ผิดพลาด มาปิดกั้นอนาคตที่สดใสรออยู่ข้างหน้า",
            "ความสุขมักเรียบง่ายและอยู่ในรายละเอียดเล็กๆ รอบตัว เสมอถ้าเราสังเกตเห็น",
            "การรู้จักพอดี คือเคล็ดลับของการมีความสุขในทุกสถานการณ์ของชีวิต",
            "จงเป็นตัวเองในเวอร์ชันที่ดีขึ้นในทุกๆวัน ไม่ใช่เวอร์ชันที่คนอื่นต้องการ",
            "ปัญหาทุกอย่างมีทางแก้ ถ้าเราตั้งสติและค่อยๆ คิดอย่างมีเหตุผล",
            "การมีความหวังคือพลังขับเคลื่อนที่ทำให้เรามีแรงก้าวเดินต่อไปในยามมืดมน",
            "สุดท้ายแล้ว ชีวิตคือการเดินทางเพื่อค้นหาความหมาย และความสุขสงบในใจของตัวเราเอง"
        ];

        function getRandomQuote(event) {
            const quoteElement = document.getElementById("quote");
            
            quoteElement.style.opacity = "0";
            
            setTimeout(() => {
                const randomIndex = Math.floor(Math.random() * quotes.length);
                quoteElement.innerText = quotes[randomIndex];
                quoteElement.style.opacity = "1";
            }, 200);

            createRelaxingParticle(event);
        }

        function createRelaxingParticle(event) {
            const particles = ["💡", "✨", "📘", "🕊️", "⭐", "🌿"];
            const particle = document.createElement("div");
            particle.className = "floating-heart";
            particle.innerText = particles[Math.floor(Math.random() * particles.length)];
            
            const x = event.clientX - 10 + (Math.random() * 30 - 15);
            const y = event.clientY - 20;

            particle.style.left = `${x}px`;
            particle.style.top = `${y}px`;

            document.body.appendChild(particle);

            setTimeout(() => {
                particle.remove();
            }, 1200);
        }
    </script>
</body>
</html>
